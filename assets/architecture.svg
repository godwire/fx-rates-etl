<svg viewBox="0 0 1040 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1040" height="340" fill="#ffffff"/>
  <text x="520" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">fx-rates-etl — pipeline + API + frontend</text>

  <!-- Row 1: ETL pipeline -->
  <g>
    <rect x="20" y="55" width="130" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="85" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Frankfurter</text>
    <text x="85" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">API</text>
  </g>
  <line x1="150" y1="90" x2="188" y2="90" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="190" y="55" width="150" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="265" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">extract →</text>
    <text x="265" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">transform → load</text>
  </g>
  <line x1="340" y1="90" x2="378" y2="90" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="380" y="55" width="150" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="455" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">SQLite</text>
    <text x="455" y="107" text-anchor="middle" font-size="11" fill="#4b5563">fx_rates table</text>
  </g>

  <text x="85" y="140" text-anchor="middle" font-size="10" fill="#6b7280">src/pipeline.py — run locally, on a schedule, or via</text>
  <text x="85" y="153" text-anchor="middle" font-size="10" fill="#6b7280">GitHub Actions cron</text>

  <!-- Row 2: API + frontend -->
  <line x1="455" y1="125" x2="455" y2="180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="365" y="182" width="180" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="455" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">FastAPI</text>
    <text x="455" y="229" text-anchor="middle" font-size="11" fill="#9a3412">src/api.py — /api/rates,</text>
    <text x="455" y="244" text-anchor="middle" font-size="11" fill="#9a3412">/api/meta, /api/refresh</text>
  </g>

  <line x1="545" y1="217" x2="588" y2="217" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="590" y="182" width="180" height="70" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="680" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d">React (Vite)</text>
    <text x="680" y="229" text-anchor="middle" font-size="11" fill="#9d174d">frontend/ — charts,</text>
    <text x="680" y="244" text-anchor="middle" font-size="11" fill="#9d174d">currency picker</text>
  </g>

  <text x="455" y="270" text-anchor="middle" font-size="10" fill="#6b7280">JSON over HTTP (CORS-enabled)</text>

  <!-- Deployment note -->
  <g>
    <rect x="365" y="285" width="180" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
    <text x="455" y="306" text-anchor="middle" font-size="10" fill="#4b5563">deployed on Render</text>
  </g>
  <g>
    <rect x="590" y="285" width="180" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
    <text x="680" y="306" text-anchor="middle" font-size="10" fill="#4b5563">deployed on Vercel</text>
  </g>
</svg>
